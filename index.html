<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savita • Gestão de Vendas</title>
<meta name="theme-color" content="#D35400">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Savita Vendas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<style>
  html,body{margin:0;height:100%;width:100%;background:#fff;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
  #wrap{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:0;overflow:auto;-webkit-overflow-scrolling:touch}
  /* iPhone: width 1px + min-width 100% impede o iframe de ficar mais largo que a tela */
  iframe{display:block;width:1px;min-width:100%;height:100%;border:0}
  #falha{display:none;padding:24px;text-align:center;color:#854300}
  #falha a{color:#D35400;font-weight:bold}
  #btnQR{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;
    background:#D35400;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5;display:flex;align-items:center;justify-content:center}
  #leitor{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
  #leitor.on{display:flex}
  #leitor video{flex:1;width:100%;object-fit:cover;min-height:0}
  #mira{position:absolute;left:50%;top:42%;width:62vw;max-width:300px;aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
  #mira.ok{border-color:#3ddc84}
  #barra{background:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
  #barra div{flex:1;min-width:0}
  #msg{font-weight:700;color:#854300;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #sub{font-size:13px;color:#68736d}
  #fechar{border:0;border-radius:10px;padding:12px 18px;background:#D35400;color:#fff;font-weight:700;font-size:15px}
  #topo{position:absolute;top:calc(12px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-size:15px;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><iframe id="app" src="https://script.google.com/macros/s/AKfycbwq_W0SlcA5pQfsQrvp2j8MZ4l3Wmp1sJcsYEWIkBBQWhmbFJfnP7sJswKrrApDB83xoQ/exec"
        allow="clipboard-write; fullscreen" title="Savita • Gestão de Vendas"></iframe></div>
<div id="falha">Não foi possível abrir o app aqui.<br><br>
  <a href="https://script.google.com/macros/s/AKfycbwq_W0SlcA5pQfsQrvp2j8MZ4l3Wmp1sJcsYEWIkBBQWhmbFJfnP7sJswKrrApDB83xoQ/exec">Abrir no navegador</a></div>

<button id="btnQR" aria-label="Ler QR Code">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3"/><rect x="7" y="7" width="4" height="4"/><rect x="13" y="13" width="4" height="4"/><path d="M13 7h4v2M7 15v2h2"/></svg>
</button>

<div id="leitor">
  <div id="topo">Aponte para o QR Code do produto</div>
  <video id="video" playsinline muted></video>
  <div id="mira"></div>
  <div id="barra"><div><div id="msg">Pronto para ler</div><div id="sub">Cada leitura soma 1 unidade ao pedido</div></div><button id="fechar">Concluir</button></div>
</div>
<canvas id="cv" style="display:none"></canvas>

<script>
  // QR Code lido pela câmera do celular: abre o app já adicionando o produto (e com o botão de leitor disponível)
  (function(){ var p=new URLSearchParams(location.search).get('p'); if(!p) return;
    var f=document.getElementById('app'); f.src=f.src.split('?')[0]+'?p='+encodeURIComponent(p);
    try{ history.replaceState(null,'',location.pathname); }catch(e){} })();
  // Guarda os dados do app (login salvo, aparelho, pedido em aberto) aqui na moldura, que o celular não apaga
  window.addEventListener('message', function(e){
    var d=e.data||{}; if (!/\.googleusercontent\.com$/.test(new URL(e.origin).hostname)) return;
    if (d.tipo==='ls-set' && /^sv_/.test(d.k)) { try{ if (d.v===null) localStorage.removeItem(d.k); else localStorage.setItem(d.k, JSON.stringify(d.v)); }catch(x){} }
    if (d.tipo==='ls-get') { var o={}; try{ for (var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if (/^sv_/.test(k)) o[k]=JSON.parse(localStorage.getItem(k)); } }catch(x){}
      try{ e.source.postMessage({tipo:'ls-all',dados:o}, e.origin); }catch(x){} }
  });
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  if (!navigator.onLine) { document.getElementById('wrap').style.display='none'; document.getElementById('falha').style.display='block'; }

  var leitor=document.getElementById('leitor'), video=document.getElementById('video'), mira=document.getElementById('mira'),
      msg=document.getElementById('msg'), sub=document.getElementById('sub'), cv=document.getElementById('cv'), ctx=cv.getContext('2d',{willReadFrequently:true});
  var stream=null, rodando=false, ultimo='', ultimoT=0, detector=null;
  try { if ('BarcodeDetector' in window) detector = new BarcodeDetector({formats:['qr_code']}); } catch(e){}

  // envia a leitura para o app (que fica em frames internos do Google)
  function enviar(id){ (function todos(w){ for (var i=0;i<w.frames.length;i++){ try{ w.frames[i].postMessage({tipo:'qr',id:id},'*'); todos(w.frames[i]); }catch(e){} } })(window); }
  window.addEventListener('message', function(e){
    var d=e.data||{}; if (d.tipo!=='qr-ok') return;
    if (d.ok){ msg.textContent='✓ '+d.nome; sub.textContent='Pedido: '+d.itens+' item(ns) • '+d.total; mira.classList.add('ok'); setTimeout(function(){mira.classList.remove('ok')},500);
      try{ navigator.vibrate && navigator.vibrate(80);}catch(e){} bip(); }
    else { msg.textContent='✗ '+(d.motivo||'Não adicionado'); }
  });
  var audio=null; function bip(){ try{ audio=audio||new (window.AudioContext||window.webkitAudioContext)(); var o=audio.createOscillator(),g=audio.createGain(); o.frequency.value=1200; g.gain.value=.08; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime+.08);}catch(e){} }

  function lido(texto){
    var id=''; try{ id=new URL(texto).searchParams.get('p')||''; }catch(e){}
    if (!id){ msg.textContent='QR Code não é de produto Savita'; return; }
    var agora=Date.now(); if (id===ultimo && agora-ultimoT<1500) return;   // evita contar a mesma leitura 2 vezes
    ultimo=id; ultimoT=agora; msg.textContent='Adicionando…'; enviar(id);
  }
  function quadro(){
    if (!rodando) return;
    if (video.readyState>=2){
      if (detector){ detector.detect(video).then(function(r){ if(r.length) lido(r[0].rawValue); }).catch(function(){}).then(function(){ setTimeout(quadro,120); }); return; }
      if (window.jsQR){ var w=480, h=Math.round(video.videoHeight*w/video.videoWidth)||480; cv.width=w; cv.height=h; ctx.drawImage(video,0,0,w,h);
        var c=jsQR(ctx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'}); if (c&&c.data) lido(c.data); }
    }
    setTimeout(quadro,120);
  }
  document.getElementById('btnQR').onclick=function(){
    leitor.classList.add('on'); msg.textContent='Abrindo câmera…'; bip();
    navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false}).then(function(s){
      stream=s; video.srcObject=s; video.play(); rodando=true; msg.textContent='Pronto para ler'; quadro();
    }).catch(function(){ msg.textContent='Permita o uso da câmera para ler QR Codes'; });
  };
  document.getElementById('fechar').onclick=function(){
    rodando=false; leitor.classList.remove('on'); if (stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; }
  };
</script>
</body>
</html>
