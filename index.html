<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savita • Gestão de Vendas</title>
<meta name="theme-color" content="#D35400">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Savita Vendas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  html,body{margin:0;height:100%;width:100%;background:#fff;overflow:hidden;font-family:system-ui,-apple-system,sans-serif}
  #wrap{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:0;overflow:auto;-webkit-overflow-scrolling:touch}
  /* iPhone: width 1px + min-width 100% impede o iframe de ficar mais largo que a tela */
  iframe{display:block;width:1px;min-width:100%;height:100%;border:0}
  #falha{display:none;padding:24px;text-align:center;color:#854300}
  #falha a{color:#D35400;font-weight:bold}
  #btnScan{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;
    background:#D35400;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:5;display:flex;align-items:center;justify-content:center}
  #scan{position:fixed;inset:0;background:#000;z-index:10;display:none;flex-direction:column}
  #scan.on{display:flex}
  #scan video{flex:1;width:100%;object-fit:cover;min-height:0}
  #mira{position:absolute;left:50%;top:40%;width:62vw;height:62vw;max-width:300px;max-height:300px;transform:translate(-50%,-50%);
    border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);transition:border-color .15s}
  #mira.ok{border-color:#2ecc71}#mira.erro{border-color:#e74c3c}
  #painel{background:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0}
  #msg{font-weight:700;color:#854300;min-height:22px}
  #resumo{color:#68736d;font-size:14px;margin:4px 0 10px}
  #ultimos{font-size:14px;color:#1b1f1d;max-height:84px;overflow:auto;margin-bottom:10px}
  .bt{width:100%;border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700;background:#D35400;color:#fff}
  #topo{position:absolute;top:calc(10px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#fff;font-weight:600;text-shadow:0 1px 3px #000}
</style>
</head>
<body>
<div id="wrap"><iframe id="app" src="https://script.google.com/macros/s/AKfycbwq_W0SlcA5pQfsQrvp2j8MZ4l3Wmp1sJcsYEWIkBBQWhmbFJfnP7sJswKrrApDB83xoQ/exec"
        allow="clipboard-write; fullscreen" title="Savita • Gestão de Vendas"></iframe></div>
<div id="falha">Não foi possível abrir o app aqui.<br><br>
  <a href="https://script.google.com/macros/s/AKfycbwq_W0SlcA5pQfsQrvp2j8MZ4l3Wmp1sJcsYEWIkBBQWhmbFJfnP7sJswKrrApDB83xoQ/exec">Abrir no navegador</a></div>

<button id="btnScan" aria-label="Escanear QR Code dos produtos">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M7 12h10"/></svg>
</button>

<div id="scan">
  <video id="video" playsinline muted></video>
  <div id="mira"></div>
  <div id="topo">Aponte para o QR Code do produto</div>
  <div id="painel">
    <div id="msg">Leitor pronto</div>
    <div id="resumo">Cada leitura adiciona 1 unidade ao pedido.</div>
    <div id="ultimos"></div>
    <button class="bt" id="fechar">Concluir</button>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  if (!navigator.onLine) { document.getElementById('wrap').style.display='none'; document.getElementById('falha').style.display='block'; }

  var app = document.getElementById('app'), scan = document.getElementById('scan'), video = document.getElementById('video'),
      mira = document.getElementById('mira'), msg = document.getElementById('msg'), resumo = document.getElementById('resumo'),
      ultimos = document.getElementById('ultimos'), stream = null, rodando = false, ultimoCod = '', ultimoT = 0,
      canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });

  // Envia o produto lido para o app (que fica dentro de quadros do Google)
  function enviar(id) {
    (function desce(w, n) {
      try { w.postMessage({ savitaScan: id }, '*'); } catch (e) {}
      if (n < 5) { try { for (var i = 0; i < w.frames.length; i++) desce(w.frames[i], n + 1); } catch (e) {} }
    })(app.contentWindow, 0);
  }
  var avisado = 0;
  window.addEventListener('message', function (e) {
    var a = e.data && e.data.savitaAck; if (!a || Date.now() - avisado < 300) return; avisado = Date.now();
    if (a.ok) {
      sinal(true); msg.textContent = '✓ ' + a.nome + ' (' + a.qtd + ' no pedido)';
      resumo.textContent = a.itens + ' item(ns) • ' + a.total;
      ultimos.insertAdjacentHTML('afterbegin', '<div>+1 ' + a.nome.replace(/</g, '&lt;') + '</div>');
    } else { sinal(false); msg.textContent = a.msg; }
  });

  function idDoCodigo(txt) {
    var m = /[?&]p=([^&#]+)/.exec(txt); if (m) return decodeURIComponent(m[1]);
    return /^[a-z0-9-]{3,60}$/i.test(txt) ? txt : '';
  }
  function sinal(ok) {
    mira.className = ok ? 'ok' : 'erro'; setTimeout(function () { mira.className = ''; }, 500);
    try { navigator.vibrate && navigator.vibrate(ok ? 60 : [40, 60, 40]); } catch (e) {}
    try { var ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = ok ? 880 : 300; g.gain.value = .08; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .12); } catch (e) {}
  }

  function loop() {
    if (!rodando) return;
    if (video.readyState >= 2 && window.jsQR) {
      var w = 480, h = Math.round(video.videoHeight * w / video.videoWidth) || 360;
      canvas.width = w; canvas.height = h; ctx.drawImage(video, 0, 0, w, h);
      var r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
      if (r && r.data) {
        var id = idDoCodigo(r.data), agora = Date.now();
        if (!id) { if (agora - ultimoT > 1500) { sinal(false); msg.textContent = 'Este QR não é de um produto Savita'; ultimoT = agora; } }
        else if (id !== ultimoCod || agora - ultimoT > 1800) { ultimoCod = id; ultimoT = agora; msg.textContent = 'Lendo…'; enviar(id); }
      }
    }
    requestAnimationFrame(loop);
  }

  document.getElementById('btnScan').onclick = function () {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('Este aparelho não permite usar a câmera aqui.'); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }).then(function (s) {
      stream = s; video.srcObject = s; video.play(); scan.classList.add('on'); rodando = true;
      msg.textContent = 'Leitor pronto'; ultimos.innerHTML = ''; ultimoCod = ''; requestAnimationFrame(loop);
    }).catch(function () { alert('Permita o uso da câmera para escanear os produtos.'); });
  };
  document.getElementById('fechar').onclick = function () {
    rodando = false; scan.classList.remove('on'); if (stream) stream.getTracks().forEach(function (t) { t.stop(); }); stream = null;
  };
</script>
</body>
</html>
