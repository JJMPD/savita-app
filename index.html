<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Savita • Gestão de Vendas</title>
<meta name="theme-color" content="#D35400">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Savita Vendas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box}
  #falha{display:none;font-family:system-ui,sans-serif;padding:24px;text-align:center;color:#854300}
  #falha a{color:#D35400;font-weight:bold}
</style>
</head>
<body>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwq_W0SlcA5pQfsQrvp2j8MZ4l3Wmp1sJcsYEWIkBBQWhmbFJfnP7sJswKrrApDB83xoQ/exec"
        allow="clipboard-write; fullscreen" title="Savita • Gestão de Vendas"></iframe>
<div id="falha">Não foi possível abrir o app aqui.<br><br>
  <a href="https://script.google.com/macros/s/AKfycbwq_W0SlcA5pQfsQrvp2j8MZ4l3Wmp1sJcsYEWIkBBQWhmbFJfnP7sJswKrrApDB83xoQ/exec">Abrir no navegador</a></div>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  if (!navigator.onLine) { document.getElementById('app').style.display='none'; document.getElementById('falha').style.display='block'; }
</script>
</body>
</html>
